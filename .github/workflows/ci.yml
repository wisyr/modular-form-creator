name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `build` runs `tsc -b` (type-check) and then the production Vite build.
      - run: npm run build
      - run: npm run e2e:typecheck
      - run: npm test

  e2e:
    name: End-to-end (Playwright + docker compose)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start backend, database and frontend
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf "http://localhost:5001/api/resources" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          docker compose logs
          exit 1

      - run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
